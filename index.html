<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zimní pošta robota Pípy</title>
<style>
:root{
  --noc:#0F1E33; --vecer:#1E3A5F; --vecer2:#2B4C75;
  --svetlo:#FFC857; --svetlo2:#FFE3A1;
  --snih:#F4F8FB; --papir:#FFFDF8; --text:#1E2A3A; --text2:#4A5B70;
  --posta:#D64545; --zelena:#2E8B57; --chyba:#C0392B;
  --A:#2F80ED; --B:#F2994A; --C:#9B51E0;
  --bunka:#EEF4FA; --linka:#C9D6E3;
}
*{box-sizing:border-box}
html{font-size:18px;background:#2B4C75}
html.velke{font-size:21px}
body{margin:0;font-family:Verdana,"Segoe UI",system-ui,sans-serif;color:var(--text);
  background:linear-gradient(180deg,var(--noc) 0%,var(--vecer) 55%,var(--vecer2) 100%) fixed;min-height:100vh;line-height:1.45}
button{font:inherit;cursor:pointer}
.snih-vrstva{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.vlocka{position:absolute;top:-20px;color:#fff;opacity:.55;animation:padej linear infinite}
@keyframes padej{to{transform:translateY(110vh) translateX(30px)}}
@media (prefers-reduced-motion:reduce){.vlocka{display:none}.robot{transition:none!important}}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px 16px 40px}
.horni{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.horni .nazev{color:var(--snih);font-weight:bold;flex:1;min-width:180px}
.tl{min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid transparent;background:var(--svetlo);color:var(--text);font-weight:bold;box-shadow:0 3px 0 #c9962e}
.tl:active{transform:translateY(2px);box-shadow:none}
.tl:disabled{opacity:.45;cursor:default}
.tl.druhe{background:var(--snih);box-shadow:0 3px 0 #a9b8c8}
.tl.maly{min-height:44px;padding:6px 12px;font-size:.9rem}
.tl.tmave{background:rgba(255,255,255,.12);color:var(--snih);border-color:rgba(255,255,255,.3);box-shadow:none}
.karta{background:var(--papir);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
h1{font-family:Georgia,serif;color:var(--snih);font-size:2rem;margin:.2em 0;text-align:center}
h2{font-family:Georgia,serif;margin:.2em 0 .4em}
.podtitul{color:var(--svetlo2);text-align:center;margin:0 0 14px}
.uvod-wrap{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media (max-width:640px){.uvod-wrap{grid-template-columns:1fr}.uvod-wrap .pipa-velky{margin:0 auto;width:150px}}
input[type=text]{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--linka);width:100%;max-width:340px}
.odkazy a{display:block;padding:10px 12px;margin:6px 0;border-radius:12px;background:var(--bunka);color:var(--vecer);text-decoration:none;font-weight:bold}
.odkazy a span{display:block;font-weight:normal;font-size:.85rem;color:var(--text2)}
details summary{cursor:pointer;font-weight:bold;min-height:44px;display:flex;align-items:center}
.podpis{color:#9fb3cc;font-size:.8rem;text-align:center;margin-top:18px}
/* mestecko */
.scena{width:100%;height:auto;display:block;border-radius:20px;background:#0b1830}
.okno{fill:#2b3f5c;transition:fill .8s}
.sviti .okno{fill:var(--svetlo);filter:url(#zar)}
.svetylko{fill:#3a4d63}
.strom-sviti .svetylko{filter:url(#zar)}
.strom-sviti .sv1{fill:#FFC857}.strom-sviti .sv2{fill:#FF6B6B}.strom-sviti .sv3{fill:#7FD3FF}
.hvezda-stromu{fill:#556}
.strom-sviti .hvezda-stromu{fill:var(--svetlo);filter:url(#zar)}
.mise-seznam{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.mise-karta{text-align:left;border:none;border-radius:18px;padding:14px;background:var(--papir);display:flex;gap:12px;align-items:center;min-height:84px;box-shadow:0 4px 0 #b9c6d4}
.mise-karta .cislo{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--vecer);color:var(--svetlo);font-weight:bold;font-size:1.2rem}
.mise-karta.hotova .cislo{background:var(--svetlo);color:var(--vecer)}
.mise-karta.zamcena{opacity:.55;cursor:default}
.mise-karta small{display:block;color:var(--text2)}
.hvezdy{color:#E0A800;letter-spacing:2px}
.banner{margin-top:14px;background:var(--svetlo);border-radius:18px;padding:14px;text-align:center;font-weight:bold}
/* mise */
.tecky{display:flex;gap:6px;flex-wrap:wrap}
.tecka{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.tecka.hotovo{background:var(--svetlo)}
.tecka.ted{outline:3px solid var(--snih)}
.zadani{font-size:1.15rem;font-weight:bold;margin:0 0 10px}
.pravidla{font-size:.85rem;background:var(--bunka);border-radius:12px;padding:8px 12px;color:var(--text2);margin-bottom:12px}
.uloha-layout{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:18px;align-items:start}
@media (max-width:760px){.uloha-layout{grid-template-columns:1fr}}
.mrizka{--n:5;position:relative;width:100%;max-width:440px;aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);border-radius:14px;overflow:hidden;border:3px solid var(--vecer);background:var(--bunka);margin:0 auto}
.bunka{position:relative;box-shadow:inset 0 0 0 1px var(--linka);display:grid;place-items:center}
.bunka.klik{cursor:pointer}
.bunka.klik:hover{background:#fff6dc}
.bunka.vybrana{background:#ffe9b0}
.bunka.spravna{background:#c9f0d6}
.bunka.spatna{background:#f8d0cb}
.bunka svg{width:78%;height:78%}
.stopa{position:absolute;width:22%;height:22%;border-radius:50%;opacity:.85}
.robot{position:absolute;left:0;top:0;width:calc(100% / var(--n));height:calc(100% / var(--n));transform:translate(calc(var(--c) * 100%),calc(var(--r) * 100%));transition:transform .38s ease-in-out;display:grid;place-items:center;pointer-events:none;z-index:3}
.robot svg{width:82%;height:82%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.radek-postupu{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.stitek{min-width:40px;height:40px;border-radius:10px;color:#fff;font-weight:bold;display:grid;place-items:center;padding:0 8px}
.chip{position:relative;width:46px;height:46px;border-radius:12px;background:#fff;border:2px solid var(--linka);display:grid;place-items:center;font-size:1.5rem;font-weight:bold;color:var(--vecer);padding:0}
.chip i{position:absolute;bottom:1px;right:4px;font-size:.6rem;font-style:normal;color:var(--text2)}
.chip.akt{border-color:var(--svetlo);background:#fff3cf;transform:scale(1.08)}
.chip.prosel{background:#e8f3ec;border-color:#9fd1b2}
.chip.bum{background:#f8d0cb;border-color:var(--chyba)}
.chip.klik{cursor:pointer}
.chip.klik:hover{border-color:var(--svetlo)}
.moznosti{display:grid;gap:10px;margin-top:6px}
.moznost{text-align:left;min-height:56px;padding:12px 14px;border-radius:14px;border:3px solid var(--linka);background:#fff;font-size:1rem}
.moznost:hover{border-color:var(--svetlo)}
.moznost.spravne{border-color:var(--zelena);background:#e3f6ea}
.moznost.spatne{border-color:var(--chyba);background:#fbe3e0}
.moznost:disabled{cursor:default}
.ovladani{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:start;margin:10px 0}
.pad button{font-size:1.8rem;border-radius:16px;border:none;background:var(--vecer);color:var(--svetlo);box-shadow:0 4px 0 #0c1a2c}
.pad button:active{transform:translateY(3px);box-shadow:none}
.program{min-height:60px;border:2px dashed var(--linka);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.program .prazdne{color:var(--text2);font-size:.9rem;padding:4px 8px}
.zpetna{margin-top:14px;border-radius:16px;padding:12px 14px;display:none;gap:12px;align-items:flex-start}
.zpetna.ukaz{display:flex}
.zpetna.ok{background:#e3f6ea;border:2px solid #9fd1b2}
.zpetna.rada{background:#fff3cf;border:2px solid #f0cf7a}
.zpetna.reseni{background:#e7eef8;border:2px solid #a9c1e0}
.zpetna .avatar{flex:0 0 52px}
.zpetna p{margin:.2em 0}
.zpetna .tl{margin-top:8px}
.otresy{animation:otres .35s}
@keyframes otres{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.odmena{text-align:center}
.odmena .hvezdy{font-size:2.4rem}
/* diplom */
.diplom{background:#fff;border:10px double var(--vecer);border-radius:18px;padding:30px;text-align:center;max-width:860px;margin:0 auto;position:relative}
.diplom h2{font-size:2.2rem;color:var(--vecer)}
.diplom .jmeno{font-family:Georgia,serif;font-size:2.4rem;color:var(--posta);margin:10px 0;border-bottom:2px solid var(--linka);display:inline-block;padding:0 30px}
.diplom .podpisy{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px;gap:20px}
.diplom .podpisy div{flex:1}
.diplom .cara{border-top:2px solid var(--text);padding-top:4px;font-size:.9rem}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  .snih-vrstva,.neprint{display:none!important}
  #app{padding:0;max-width:none}
  .diplom{box-shadow:none;border-color:#1E3A5F;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.skryte{display:none!important}
</style>
</head>
<body>
<div class="snih-vrstva" id="snih" aria-hidden="true"></div>
<main id="app"></main>

<script>
// =====================================================================
// ===== DATA HRY: zde učitel upravuje obsah ===========================
// =====================================================================
// Souřadnice políček se píšou jako [řádek, sloupec] a počítají se od 0
// zleva nahoře. Mřížka 5×5 má tedy řádky i sloupce 0 až 4.
// Postupy se píšou šipkami ↑ ↓ ← → bez mezer, např. "↑↑→→".
// Správné odpovědi u mřížek se počítají automaticky podle pravidel
// (1 šipka = 1 krok, před stromem nebo okrajem se Pípa zastaví).
// =====================================================================
const HRA = {
  nazev: "Zimní pošta robota Pípy",
  podtitul: "Informatika • 4. třída • Algoritmus jako přesný postup",
  klic: "inf-zimni-posta-4-v1",
  autor: "Mgr. Helena Gřivová",
  uvod: "Ahoj, jsem Pípa, robot-pošťák. Ve městečku se stmívá a já mám plnou tašku balíčků. Jenže neumím číst myšlenky. Potřebuju přesné příkazy ve správném pořadí. Pomůžeš mi rozsvítit celé městečko?",
  pravidla: "1 šipka = 1 krok do sousedního políčka • příkazy čteme zleva doprava • před stromem nebo okrajem se Pípa zastaví",
  odkazy: [
    {nazev: "🎬 Video: Jedou algoritmy ve správném rytmu?", popis: "ČT edu, 2 min 33 s", url: "https://edu.ceskatelevize.cz/video/18170-digitalni-svet-jedou-algoritmy-ve-spravnem-rytmu"},
    {nazev: "🎬 Video: Programování", popis: "ČT edu, 7 minut (pro zájemce)", url: "https://edu.ceskatelevize.cz/video/15625-programovani"},
    {nazev: "🧩 Procvičování: Posloupnosti příkazů", popis: "Umíme informatiku, 4. třída", url: "https://www.umimeinformatiku.cz/cviceni-algoritmicke-mysleni-zaklady-4-trida"}
  ],
  pochvaly: ["Výborně!", "Přesně tak!", "Pípa děkuje!", "Balíček je doma!", "Skvělá práce!", "Jsi přesný jako hodinky!", "Správně!"],
  zaver: "Všechny balíčky jsou doma! Městečko svítí díky tvým přesným algoritmům. Na náměstí se rozsvítil vánoční strom.",
  diplom: {
    nadpis: "Diplom",
    titul: "Mistr přesného postupu",
    text: "pomohl(a) robotu Pípovi doručit všechny balíčky. Umí poznat příkaz a algoritmus, ví, že záleží na pořadí příkazů, a najde i opraví chybný krok."
  },

  mise: [
    { id: "m1", nazev: "Přesný příkaz", ulice: "Poštovní ulice", typ: "kviz",
      uvod: "Než vyrazíme, musím vědět, čemu rozumím. Pomoz mi poznat přesný příkaz a algoritmus.",
      zaverMise: "Teď už víš: příkaz je jeden přesný pokyn a algoritmus je přesný postup kroků ve správném pořadí.",
      ulohy: [
        {zadani: "Který pokyn je pro Pípu přesný příkaz?", moznosti: ["Udělej jeden krok nahoru.", "Jdi k domu.", "Pospěš si."], spravne: 0,
         napoveda: "Přesný příkaz říká, co přesně má Pípa udělat. Jeden pohyb, jeden směr.",
         vysvetleni: "„Udělej jeden krok nahoru“ je jeden přesný pokyn. „Jdi k domu“ neříká, kudy jít."},
        {zadani: "Proč Pípa nerozumí pokynu „dojdi tam“?", moznosti: ["Neříká, jak se má pohybovat.", "Je moc krátký.", "Pípa je unavený."], spravne: 0,
         napoveda: "Zkus si představit, že jsi robot. Víš, kterým směrem a kolik kroků máš udělat?",
         vysvetleni: "Slovo „tam“ neříká směr ani počet kroků. Robot neuhodne, co máme na mysli."},
        {zadani: "„Doruč balíček do modrého domu.“ Co to je?", moznosti: ["Cíl", "Algoritmus"], spravne: 0,
         napoveda: "Říká ta věta, KAM chceme dojít, nebo JAK tam dojdeme?",
         vysvetleni: "Je to cíl. Říká, kam chceme dojít. Neříká, jak se tam dostaneme."},
        {zadani: "„↑ ↑ → →“ Co to je?", moznosti: ["Algoritmus", "Cíl"], spravne: 0,
         napoveda: "Jsou to seřazené kroky, které popisují cestu?",
         vysvetleni: "Je to algoritmus. Jsou to přesné kroky ve správném pořadí."},
        {zadani: "Co je příkaz?", moznosti: ["Jeden přesný pokyn.", "Celá cesta k domu.", "Místo, kam jdeme."], spravne: 0,
         napoveda: "Příkaz je jen jeden krok, ne celý postup.",
         vysvetleni: "Příkaz je jeden přesný pokyn, například jedna šipka."},
        {zadani: "Co je algoritmus?", moznosti: ["Přesný postup kroků ve správném pořadí.", "Jeden pokyn.", "Místo, kam chceme dojít."], spravne: 0,
         napoveda: "Algoritmus se skládá z více příkazů. Záleží i na tom, jak jdou po sobě.",
         vysvetleni: "Algoritmus je přesný postup kroků ve správném pořadí."},
        {zadani: "Kolik kroků udělá Pípa podle postupu ↑ ↑ → ?", moznosti: ["3", "2", "4"], spravne: 0,
         napoveda: "Každá šipka znamená jeden krok. Spočítej šipky, ne směry.",
         vysvetleni: "Jsou tam 3 šipky, takže Pípa udělá 3 kroky."},
        {zadani: "Pípa narazil do stromu. Co uděláme nejdřív?", moznosti: ["Zkontrolujeme příkazy a jejich pořadí.", "Všechno smažeme a zkusíme hádat.", "Pípa je asi rozbitý."], spravne: 0,
         napoveda: "Chyba není neúspěch. Pomáhá nám najít krok, který je potřeba opravit.",
         vysvetleni: "Nejdřív zkontrolujeme příkazy a jejich pořadí. Najdeme chybný krok a opravíme ho."}
      ]
    },

    { id: "m2", nazev: "Krok za krokem", ulice: "Pekařská ulice", typ: "kam",
      uvod: "Dostal jsem šipky. Kam podle nich dojdu? Klepni na políčko, kde skončím.",
      zaverMise: "Krok za krokem, jedna šipka po druhé. Tak se algoritmus provádí.",
      ulohy: [
        {n: 4, start: [3,0], prekazky: [], postup: "↑↑"},
        {n: 4, start: [3,0], prekazky: [], postup: "→→↑"},
        {n: 4, start: [3,1], prekazky: [[1,1]], postup: "→↑↑↑"},
        {n: 4, start: [0,0], prekazky: [[1,1]], postup: "→→↓↓"},
        {n: 5, start: [4,0], prekazky: [[2,1]], postup: "→→↑↑↑"},
        {n: 5, start: [4,2], prekazky: [[2,2]], postup: "←↑↑↑→"},
        {n: 5, start: [0,4], prekazky: [[1,3],[3,2]], postup: "↓↓↓←←"},
        {n: 5, start: [4,4], prekazky: [[3,3],[1,2]], postup: "↑↑←←←↑"},
        {n: 5, start: [2,0], prekazky: [[2,2],[1,3]], postup: "↑→→→↓↓"},
        {n: 5, start: [4,0], prekazky: [[3,1],[1,2],[2,4]], postup: "↑↑→→↑→↓"}
      ]
    },

    { id: "m3", nazev: "Na pořadí záleží", ulice: "Školní ulice", typ: "poradi",
      uvod: "Mám dva postupy se stejnými šipkami, jen v jiném pořadí. Který z nich doručí balíček?",
      zaverMise: "Stejné příkazy v jiném pořadí mohou dovést úplně jinam. Na pořadí záleží!",
      ulohy: [
        {n: 4, start: [3,0], cil: [0,1], prekazky: [[1,0]], A: "↑↑↑→", B: "→↑↑↑"},
        {n: 5, start: [4,0], cil: [0,2], prekazky: [[2,1]], A: "↑↑↑↑→→", B: "↑→↑↑↑→", poznamka: "Tuhle mřížku znáš z pracovního listu!"},
        {n: 4, start: [3,3], cil: [0,2], prekazky: [[2,2]], A: "←↑↑↑", B: "↑↑↑←"},
        {n: 5, start: [4,2], cil: [1,4], prekazky: [[3,3],[2,1]], A: "↑↑→→↑", B: "→→↑↑↑"},
        {n: 5, start: [0,0], cil: [3,3], prekazky: [[1,0],[2,2]], A: "→→→↓↓↓", B: "↓↓↓→→→"},
        {n: 5, start: [4,4], cil: [0,0], prekazky: [[2,4],[1,1]], A: "↑↑↑↑←←←←", B: "←↑↑↑↑←←←"},
        {n: 5, start: [2,0], cil: [2,4], prekazky: [[2,2]], A: "→→↑→→↓", B: "↑→→→→↓"},
        {n: 5, start: [4,1], cil: [0,3], prekazky: [[2,1],[1,3],[3,3]], A: "→↑↑↑↑→", B: "↑↑↑↑→→"}
      ]
    },

    { id: "m4", nazev: "Hledej, kde to drhne", ulice: "Ulice U Kašny", typ: "chyba",
      uvod: "Au! Některé postupy mě nedovedly k domu. Najdi příkaz, při kterém se cesta pokazila, a vyber opravu.",
      zaverMise: "Když algoritmus nefunguje, hledáme konkrétní chybný krok. Pak ho opravíme a znovu vyzkoušíme.",
      ulohy: [
        {n: 4, start: [3,0], cil: [0,0], prekazky: [[1,0]], postup: "↑↑↑", opravy: ["→↑↑↑←", "→↑↑←↑", "↑↑→↑←"]},
        {n: 4, start: [3,0], cil: [0,3], prekazky: [[3,2]], postup: "→→→↑↑↑", opravy: ["↑↑↑→→→", "→→↑↑↑→", "→↑→→→↑↑"]},
        {n: 4, start: [0,0], cil: [3,2], prekazky: [], postup: "→→→→↓↓↓", opravy: ["→→↓↓↓", "→→→↓↓↓", "↓↓↓↓→→"]},
        {n: 5, start: [4,0], cil: [0,2], prekazky: [[2,1]], postup: "↑→↑↑↑→", opravy: ["↑↑↑↑→→", "→↑↑↑↑→", "↑↑→↑↑→"]},

// =====================================================================
// ===== ENGINE: sem běžně není potřeba zasahovat ======================
// =====================================================================
const D = {'↑':[-1,0],'↓':[1,0],'←':[0,-1],'→':[0,1]};
const SLOVA = {'↑':'nahoru','↓':'dolů','←':'vlevo','→':'vpravo'};
const BARVY = ['var(--A)','var(--B)','var(--C)'];
const PISMENA = ['A','B','C'];
const RYCHLOST = 420;
let zaneprazdneno = false;

function sipky(s){ return [...s].filter(ch => D[ch]); }
function stejne(a,b){ return a && b && a[0]===b[0] && a[1]===b[1]; }
function jePrekazka(u,r,c){ return (u.prekazky||[]).some(p => p[0]===r && p[1]===c); }
function simuluj(u, postup){
  let [r,c] = u.start; const cesta = [[r,c]]; const p = sipky(postup);
  for (let i=0;i<p.length;i++){
    const d = D[p[i]]; const nr = r+d[0], nc = c+d[1];
    if (nr<0 || nr>=u.n || nc<0 || nc>=u.n) return {konec:[r,c], stop:i, proc:'okraj', cesta};
    if (jePrekazka(u,nr,nc)) return {konec:[r,c], stop:i, proc:'strom', cesta};
    r=nr; c=nc; cesta.push([r,c]);
  }
  return {konec:[r,c], stop:-1, cesta};
}
function dojde(u, postup){ const s = simuluj(u,postup); return s.stop<0 && stejne(s.konec, u.cil); }
function nejkratsi(u){
  const start = u.start.join(','), q = [[u.start, '']], videno = new Set([start]);
  while (q.length){
    const [p, cesta] = q.shift();
    if (stejne(p, u.cil)) return cesta;
    for (const k of Object.keys(D)){
      const n = [p[0]+D[k][0], p[1]+D[k][1]], key = n.join(',');
      if (n[0]<0||n[0]>=u.n||n[1]<0||n[1]>=u.n||jePrekazka(u,n[0],n[1])||videno.has(key)) continue;
      videno.add(key); q.push([n, cesta+k]);
    }
  }
  return null;
}
function tvar(n, a, b, c){ return n===1?a:(n>=2&&n<=4?b:c); }
function kroky(n){ return n+' '+tvar(n,'krok','kroky','kroků'); }
function popisVysledku(u, postup){
  const s = simuluj(u, postup);
  if (s.stop>=0) return `narazí při ${s.stop+1}. příkazu (${s.proc==='okraj'?'okraj mřížky':'strom'})`;
  if (u.cil && !stejne(s.konec,u.cil)) return 'dojde k jinému domu, ne k cíli';
  return `dojde do cíle (${kroky(sipky(postup).length)})`;
}
// výpočet správné odpovědi pro každou úlohu
function odpoved(m, u){
  if (m.typ==='kviz') return u.spravne;
  if (m.typ==='kam') return simuluj(u,u.postup).konec;
  if (m.typ==='poradi'){ const a=dojde(u,u.A), b=dojde(u,u.B); return a&&b?'oba':a?'A':b?'B':'zadny'; }
  if (m.typ==='chyba') return {stop: simuluj(u,u.postup).stop, oprava: u.opravy.findIndex(o=>dojde(u,o))};
  if (m.typ==='stavba') return nejkratsi(u);
  if (m.typ==='porovnani'){
    const ok = u.cesty.map(c=>dojde(u,c));
    if (u.otazka==='narazi') return ok.findIndex(x=>!x);
    if (u.otazka==='bezpecna') return ok.findIndex(x=>x);
    if (u.otazka==='kolik') return ok.filter(x=>x).length;
    if (u.otazka==='nejkratsi'){ let best=-1; u.cesty.forEach((c,i)=>{ if(ok[i] && (best<0 || sipky(c).length<sipky(u.cesty[best]).length)) best=i; }); return best; }
  }
}
// kontrola dat (vypíše problémy do konzole)
function zkontrolujData(){
  const chyby = [];
  HRA.mise.forEach(m => m.ulohy.forEach((u,i) => {
    const k = `${m.nazev}, úloha ${i+1}`;
    if (m.typ==='kviz' && !(u.spravne>=0 && u.spravne<u.moznosti.length)) chyby.push(k+': špatný index správné odpovědi');
    if (m.typ!=='kviz'){
      if (jePrekazka(u,...u.start)) chyby.push(k+': start je na stromu');
      if (u.cil && jePrekazka(u,...u.cil)) chyby.push(k+': cíl je na stromu');
    }
    if (m.typ==='poradi' && [...u.A].sort().join()!==[...u.B].sort().join()) chyby.push(k+': A a B nemají stejné šipky');
    if (m.typ==='chyba'){
      if (dojde(u,u.postup)) chyby.push(k+': chybný postup ve skutečnosti dojde');
      if (simuluj(u,u.postup).stop<0) chyby.push(k+': chybný postup nikam nenaráží');
      if (u.opravy.filter(o=>dojde(u,o)).length!==1) chyby.push(k+': opravy nemají právě jednu správnou');
    }
    if (m.typ==='stavba' && !nejkratsi(u)) chyby.push(k+': cesta k cíli neexistuje');
    if (m.typ==='porovnani'){
      const ok = u.cesty.map(c=>dojde(u,c));
      if (u.otazka==='narazi' && ok.filter(x=>!x).length!==1) chyby.push(k+': nenaráží právě jedna cesta');
      if (u.otazka==='bezpecna' && ok.filter(x=>x).length!==1) chyby.push(k+': nedojde právě jedna cesta');
      if (u.otazka==='nejkratsi'){ const d=u.cesty.filter((c,j)=>ok[j]).map(c=>sipky(c).length); if(d.filter(x=>x===Math.min(...d)).length!==1) chyby.push(k+': nejkratší cesta není jednoznačná'); }
    }
  }));
  if (chyby.length) console.warn('Kontrola dat:', chyby); else console.log('Kontrola dat: vše v pořádku');
  return chyby;
}

function vytvorMrizku(u, opts={}){
  const el = document.createElement('div');
  el.className = 'mrizka'; el.style.setProperty('--n', u.n);
  for (let r=0;r<u.n;r++) for (let c=0;c<u.n;c++){
    const b = document.createElement('div'); b.className='bunka'; b.dataset.r=r; b.dataset.c=c;
    if (jePrekazka(u,r,c)) b.innerHTML = stromSVG();
    else if (u.cil && stejne(u.cil,[r,c])) b.innerHTML = domSVG();
    if (opts.klik && !jePrekazka(u,r,c)) { b.classList.add('klik'); b.setAttribute('role','button'); b.setAttribute('aria-label',`políčko řádek ${r+1}, sloupec ${c+1}`); }
    el.appendChild(b);
  }
  const robot = document.createElement('div'); robot.className='robot'; robot.innerHTML = pipaSVG(); el.appendChild(robot);
  const g = {
    el, u, robot, pos:[...u.start],
    bunka:(r,c) => el.querySelector(`.bunka[data-r="${r}"][data-c="${c}"]`),
    postav(r,c){ this.pos=[r,c]; robot.style.setProperty('--r',r); robot.style.setProperty('--c',c); },
    reset(){ el.querySelectorAll('.stopa').forEach(s=>s.remove()); el.querySelectorAll('.bunka').forEach(b=>b.classList.remove('vybrana','spravna','spatna')); this.postav(...u.start); },
    stopa(r,c,i){ const s=document.createElement('div'); s.className='stopa'; s.style.background=BARVY[i||0];
      s.style.left=['14%','42%','70%'][i||0]; s.style.top=['14%','42%','70%'][i||0]; this.bunka(r,c).appendChild(s); }
  };
  g.postav(...u.start);
  return g;
}
function radekPostupu(postup, opts={}){
  const row = document.createElement('div'); row.className='radek-postupu';
  if (opts.stitek!=null){ const s=document.createElement('div'); s.className='stitek'; s.style.background=BARVY[opts.stitek]; s.textContent=PISMENA[opts.stitek]; row.appendChild(s); }
  sipky(postup).forEach((ch,i) => {
    const b = document.createElement(opts.klik?'button':'div'); b.className='chip'+(opts.klik?' klik':'');
    b.innerHTML = `${ch}<i>${i+1}</i>`; b.setAttribute('aria-label', `${i+1}. příkaz: ${SLOVA[ch]}`); b.dataset.i=i;
    row.appendChild(b);
  });
  return row;
}
// jeden krok animace; vrací false při nárazu
async function krok(g, ch, stopaIdx, chip){
  const d = D[ch], nr=g.pos[0]+d[0], nc=g.pos[1]+d[1];
  if (chip) chip.classList.add('akt');
  if (nr<0||nr>=g.u.n||nc<0||nc>=g.u.n||jePrekazka(g.u,nr,nc)){
    const [r,c]=g.pos;
    g.robot.style.setProperty('--r', r+d[0]*0.3); g.robot.style.setProperty('--c', c+d[1]*0.3);
    await cekej(RYCHLOST*0.6); g.postav(r,c); await cekej(RYCHLOST*0.5);
    if (chip){ chip.classList.remove('akt'); chip.classList.add('bum'); }
    g.el.classList.add('otresy'); setTimeout(()=>g.el.classList.remove('otresy'),400);
    return false;
  }
  g.postav(nr,nc); await cekej(RYCHLOST);
  if (stopaIdx!=null) g.stopa(nr,nc,stopaIdx);
  if (chip){ chip.classList.remove('akt'); chip.classList.add('prosel'); }
  return true;
}
async function prehraj(g, postup, stopaIdx, radek){
  zaneprazdneno = true;
  g.postav(...g.u.start);
  if (radek) radek.querySelectorAll('.chip').forEach(c=>c.classList.remove('akt','prosel','bum'));
  const p = sipky(postup); let ok = true;
  for (let i=0;i<p.length;i++){
    const chip = radek ? radek.querySelectorAll('.chip')[i] : null;
    if (!(await krok(g, p[i], stopaIdx, chip))) { ok=false; break; }
  }
  zaneprazdneno = false;
  return ok;
}

    : `<label for="jmeno"><b>Jak se jmenuješ?</b></label><br><input type="text" id="jmeno" maxlength="30" autocomplete="off" placeholder="Tvoje jméno">
      <div class="ovladani"><button class="tl" id="start">Vyrazit na poštu ▶</button></div>`}
    </div></div>
    <details style="margin-top:14px"><summary>📺 Než začneš: video a procvičování</summary><div class="odkazy">
      ${HRA.odkazy.map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.nazev)}<span>${esc(o.popis)}</span></a>`).join('')}</div></details>
  </div><p class="podpis">${esc(HRA.autor)} (vytvořeno pomocí AI)</p>`;
  const start = document.getElementById('start');
  if (start){
    const inp = document.getElementById('jmeno');
    const jdi = () => { const j = inp.value.trim(); if(!j){ inp.focus(); inp.style.borderColor='var(--chyba)'; return; } S.jmeno=j; uloz(); mestecko(); };
    start.onclick = jdi; inp.onkeydown = e => { if(e.key==='Enter') jdi(); };
  } else {
    document.getElementById('pokracuj').onclick = mestecko;
    document.getElementById('znovu').onclick = () => {
      if (confirm('Opravdu začít znovu? Smaže se jméno i rozsvícené ulice.')){ const v=S.velke; S=novyStav(); S.velke=v; uloz(); uvod(); }
    };
  }
}

function odemcena(i){ return i===0 || !!S.hotovo[HRA.mise[i-1].id]; }
function mestecko(){
  const vse = HRA.mise.every(m=>S.hotovo[m.id]);
  $app.innerHTML = hlavicka(`Městečko • ${esc(S.jmeno)}`) + scenaSVG() +
    (vse ? `<div class="banner">🎉 ${esc(HRA.zaver)}<div class="ovladani" style="justify-content:center"><button class="tl druhe" id="diplom">🎓 Získat diplom</button></div></div>` : '') +
    `<div class="mise-seznam">${HRA.mise.map((m,i)=>{
      const h = S.hotovo[m.id], ok = odemcena(i);
      return `<button class="mise-karta ${h?'hotova':''} ${ok?'':'zamcena'}" data-i="${i}" ${ok?'':'aria-disabled="true"'}>
        <div class="cislo">${ok?(i+1):'🔒'}</div><div><b>${esc(m.nazev)}</b><small>${esc(m.ulice)} • ${m.ulohy.length} úloh</small>
        ${h?`<span class="hvezdy">${hvezdy(h.hvezdy)}</span>`:''}</div></button>`;
    }).join('')}</div>`;
  navazHlavicku();
  $app.querySelectorAll('.mise-karta').forEach(b => b.onclick = () => { const i=+b.dataset.i; if(odemcena(i)) otevriMisi(i); });
  const d = document.getElementById('diplom'); if (d) d.onclick = diplom;
}

function otevriMisi(mi){
  const m = HRA.mise[mi];
  let p = S.pozice[m.id];
  if (!p || p.i>=m.ulohy.length) p = S.pozice[m.id] = {i:0, ok:0};
  if (p.i===0){
    $app.innerHTML = hlavicka(esc(m.nazev)) + `<div class="karta"><div class="uvod-wrap"><div class="pipa-velky">${pipaSVG()}</div>
      <div><h2>${mi+1}. ${esc(m.nazev)}</h2><p style="font-size:1.1rem">${esc(m.uvod)}</p>
      <div class="ovladani"><button class="tl" id="jdi">Začít ▶</button></div></div></div></div>`;
    navazHlavicku();
    document.getElementById('jdi').onclick = () => uloha(mi);
  } else uloha(mi);
}

function uloha(mi){
  const m = HRA.mise[mi], p = S.pozice[m.id], u = m.ulohy[p.i];
  $app.innerHTML = hlavicka(`${mi+1}. ${esc(m.nazev)}`) +
    `<div class="tecky neprint" style="margin-bottom:10px">${m.ulohy.map((_,j)=>`<span class="tecka ${j<p.i?'hotovo':''} ${j===p.i?'ted':''}"></span>`).join('')}</div>
    <div class="karta"><div id="obsah"></div>
    <div class="zpetna" id="zpetna" aria-live="polite"><div class="avatar">${pipaSVG()}</div><div><div id="zpetna-text"></div>
    <button class="tl skryte" id="dalsi">Další ▶</button></div></div></div>`;
  navazHlavicku();
  const obsah = document.getElementById('obsah');
  let chybaVUloze = false;
  const ctx = {
    m, u, obsah,
    zprava(druh, html){ const z=document.getElementById('zpetna'); z.className='zpetna ukaz '+druh; document.getElementById('zpetna-text').innerHTML=html; },
    chyba(){ chybaVUloze = true; },
    hotovo(html, druh){
      ctx.zprava(druh || (chybaVUloze?'reseni':'ok'), html);
      const b = document.getElementById('dalsi'); b.classList.remove('skryte'); b.focus({preventScroll:true});
      b.onclick = () => { if(zaneprazdneno) return; if(!chybaVUloze) p.ok++; p.i++; uloz(); p.i>=m.ulohy.length ? dokonciMisi(mi) : uloha(mi); };
    }
  };
  ({kviz:ulohaKviz, kam:ulohaKam, poradi:ulohaPoradi, chyba:ulohaChyba, stavba:ulohaStavba, porovnani:ulohaPorovnani})[m.typ](ctx);
}
const pochvala = () => `<p><b>${nahodne(HRA.pochvaly)}</b></p>`;
const pravidlaHTML = () => `<div class="pravidla">${esc(HRA.pravidla)}</div>`;

// --- typ: kvíz ---
function ulohaKviz(ctx){
  const {u, obsah} = ctx; let pokusy = 0;
  obsah.innerHTML = `<p class="zadani">${esc(u.zadani)}</p><div class="moznosti"></div>`;
  const box = obsah.querySelector('.moznosti');
  zamichej(u.moznosti.map((t,i)=>({t,i}))).forEach(({t,i}) => {
    const b = document.createElement('button'); b.className='moznost'; b.textContent=t;
    b.onclick = () => {
      if (i===u.spravne){ b.classList.add('spravne'); box.querySelectorAll('button').forEach(x=>x.disabled=true);
        ctx.hotovo(pochvala()+`<p>${esc(u.vysvetleni)}</p>`); return; }
      pokusy++; ctx.chyba(); b.classList.add('spatne'); b.disabled=true;
      if (pokusy===1) ctx.zprava('rada', `<p><b>Ještě jednou.</b> ${esc(u.napoveda)}</p>`);
      else { box.querySelectorAll('button').forEach(x=>{ x.disabled=true; if(x.textContent===u.moznosti[u.spravne]) x.classList.add('spravne'); });
        ctx.hotovo(`<p><b>Správná odpověď je označená zeleně.</b></p><p>${esc(u.vysvetleni)}</p>`); }
    };
    box.appendChild(b);
  });
}

// --- typ: kam dojde ---
function ulohaKam(ctx){
  const {u, obsah} = ctx; const sim = simuluj(u,u.postup); const cil = sim.konec;
  const bezStromu = simuluj({...u, prekazky:[]}, u.postup).konec;
  let pokusy = 0, krokIdx = 0, hotovo = false;
  obsah.innerHTML = `<p class="zadani">Kde Pípa skončí? Klepni na políčko.</p>${pravidlaHTML()}<div class="uloha-layout"><div id="m"></div><div>
    <b>Postup:</b><div id="r"></div><div class="ovladani"><button class="tl druhe maly skryte" id="krokuj">Krok ▶</button><button class="tl druhe maly skryte" id="vrat">Znovu od startu ⟲</button></div></div></div>`;
  const g = vytvorMrizku(u, {klik:true}); obsah.querySelector('#m').appendChild(g.el);
  const radek = radekPostupu(u.postup); obsah.querySelector('#r').appendChild(radek);
  const tlKrok = obsah.querySelector('#krokuj'), tlVrat = obsah.querySelector('#vrat');
  const chips = radek.querySelectorAll('.chip');
  const vrat = () => { g.reset(); krokIdx=0; chips.forEach(c=>c.classList.remove('akt','prosel','bum')); tlKrok.disabled=false; };
  tlVrat.onclick = () => { if(!zaneprazdneno) vrat(); };
  tlKrok.onclick = async () => {
    if (zaneprazdneno || krokIdx>=chips.length) return;
    zaneprazdneno = true; const ok = await krok(g, sipky(u.postup)[krokIdx], 0, chips[krokIdx]); zaneprazdneno = false;
    krokIdx++; if (!ok || krokIdx>=chips.length) tlKrok.disabled = true;
  };
  g.el.querySelectorAll('.bunka.klik').forEach(b => b.onclick = async () => {
    if (hotovo || zaneprazdneno) return;
    const pos = [+b.dataset.r, +b.dataset.c];
    g.el.querySelectorAll('.bunka').forEach(x=>x.classList.remove('vybrana','spatna'));
    const vysv = sim.stop>=0 ? `Při ${sim.stop+1}. příkazu by Pípa vstoupil ${sim.proc==='okraj'?'mimo mřížku':'do stromu'}, a tak se zastavil.` : `Pípa provedl všechny příkazy a zastavil se.`;
    if (stejne(pos,cil)){
      hotovo = true; tlKrok.classList.add('skryte'); tlVrat.classList.add('skryte');
      vrat(); await prehraj(g, u.postup, 0, radek); g.bunka(...cil).classList.add('spravna');
      ctx.hotovo(pochvala()+`<p>${vysv}</p>`); return;
    }
    pokusy++; ctx.chyba(); b.classList.add('spatna');
    if (pokusy===1){
      let rada = 'Klepni na <b>Krok ▶</b> a sleduj Pípu po jednom příkazu. Pak klepni na políčko, kde skončil.';
      if (sim.stop>=0 && stejne(pos,bezStromu)) rada = 'Pozor, Pípa stromem ani okrajem neprojde. Před překážkou se zastaví a další příkazy už neprovádí. ' + rada;
      ctx.zprava('rada', `<p><b>Ještě jednou.</b> ${rada}</p>`);
      tlKrok.classList.remove('skryte'); tlVrat.classList.remove('skryte');
    } else {
      hotovo = true; tlKrok.classList.add('skryte'); tlVrat.classList.add('skryte');
      vrat(); await prehraj(g, u.postup, 0, radek); g.bunka(...cil).classList.add('spravna');
      ctx.hotovo(`<p><b>Podívej, kam Pípa došel.</b> Je to zelené políčko.</p><p>${vysv}</p>`);
    }
  });
}

// --- typ: pořadí ---
function ulohaPoradi(ctx){
  const {m, u, obsah} = ctx; const spravne = odpoved(m,u); let pokusy = 0;
  obsah.innerHTML = `<p class="zadani">Který postup doručí balíček do domu?</p>${u.poznamka?`<p>📄 ${esc(u.poznamka)}</p>`:''}${pravidlaHTML()}
    <div class="uloha-layout"><div id="m"></div><div><div id="r"></div><div class="moznosti" id="o"></div></div></div>`;
  const g = vytvorMrizku(u); obsah.querySelector('#m').appendChild(g.el);
  const rA = radekPostupu(u.A,{stitek:0}), rB = radekPostupu(u.B,{stitek:1});
  obsah.querySelector('#r').append(rA, rB);
  const volby = [['A','Postup A'],['B','Postup B'],['oba','Oba postupy']];
  const box = obsah.querySelector('#o');
  const vysv = () => `<p>Postup A ${popisVysledku(u,u.A)}. Postup B ${popisVysledku(u,u.B)}.</p>`;
  const ukaz = async () => { g.reset(); await prehraj(g,u.A,0,rA); await cekej(300); await prehraj(g,u.B,1,rB); };
  volby.forEach(([k,t]) => {
    const b = document.createElement('button'); b.className='moznost'; b.textContent=t; b.dataset.k=k;
    b.onclick = async () => {
      if (zaneprazdneno) return;
      if (k===spravne){ b.classList.add('spravne'); box.querySelectorAll('button').forEach(x=>x.disabled=true);
        await ukaz(); ctx.hotovo(pochvala()+vysv()); return; }
      pokusy++; ctx.chyba(); b.classList.add('spatne'); b.disabled=true;
      if (pokusy===1) ctx.zprava('rada', `<p><b>Ještě jednou.</b> Projdi prstem po mřížce nejdřív postup A, pak postup B. Po každé šipce se zastav a podívej se, jestli tam není strom.</p>`);
      else { box.querySelectorAll('button').forEach(x=>{ x.disabled=true; if(x.dataset.k===spravne) x.classList.add('spravne'); });
        await ukaz(); ctx.hotovo(`<p><b>Podívej se na obě cesty.</b></p>`+vysv()); }
    };
    box.appendChild(b);
  });
}

// --- typ: hledej chybu ---
function ulohaChyba(ctx){
  const {m, u, obsah} = ctx; const sp = odpoved(m,u); let pokusy = 0, faze = 0;
  obsah.innerHTML = `<p class="zadani" id="zad">Pípa nedošel k domu. Klepni na <b>Přehrát</b> a sleduj ho.</p>${pravidlaHTML()}
    <div class="uloha-layout"><div id="m"></div><div><b>Postup:</b><div id="r"></div>
    <div class="ovladani"><button class="tl" id="prehraj">Přehrát ▶</button></div><div class="moznosti" id="o"></div></div></div>`;
  const g = vytvorMrizku(u); obsah.querySelector('#m').appendChild(g.el);
  const radek = radekPostupu(u.postup,{klik:true}); obsah.querySelector('#r').appendChild(radek);
  const zad = obsah.querySelector('#zad'), tl = obsah.querySelector('#prehraj');
  const chips = radek.querySelectorAll('.chip');
  const narazText = `Pípa ${u.opravy && simuluj(u,u.postup).proc==='okraj'?'by vyšel z mřížky':'narazil do stromu'} při <b>${sp.stop+1}. příkazu</b>.`;
  tl.onclick = async () => {
    if (zaneprazdneno) return; g.reset(); await prehraj(g, u.postup, 0, radek);
    if (faze===0){ faze=1; tl.textContent='Přehrát znovu ⟲'; zad.innerHTML = 'Klepni na příkaz, při kterém se Pípa zastavil.';
      chips.forEach(c=>c.classList.remove('prosel','bum')); }
  };
  chips.forEach((c,i) => c.onclick = () => {
    if (faze!==1 || zaneprazdneno) return;
    if (i===sp.stop){ c.classList.add('bum'); faze=2; pokusy=0; ctx.zprava('ok', pochvala()+`<p>${narazText} Teď vyber opravený postup.</p>`); ukazOpravy(); return; }
    pokusy++; ctx.chyba();
    if (pokusy===1) ctx.zprava('rada', `<p><b>Ještě jednou.</b> Přehraj cestu znovu a počítej příkazy: 1, 2, 3... U kterého čísla se Pípa zarazil?</p>`);
    else { chips[sp.stop].classList.add('bum'); faze=2; pokusy=0; ctx.zprava('reseni', `<p>${narazText} Je označený červeně. Teď vyber opravený postup.</p>`); ukazOpravy(); }
  });
  function ukazOpravy(){
    zad.innerHTML = 'Který opravený postup dovede Pípu k domu?'; tl.classList.add('skryte');
    const box = obsah.querySelector('#o');
    zamichej(u.opravy.map((o,i)=>({o,i}))).forEach(({o,i},poradi) => {
      const b = document.createElement('button'); b.className='moznost'; b.dataset.i=i;
      b.appendChild(radekPostupu(o,{stitek:poradi}));
      b.onclick = async () => {
        if (zaneprazdneno) return;
        g.reset();
        if (i===sp.oprava){ b.classList.add('spravne'); box.querySelectorAll('button').forEach(x=>x.disabled=true);
          await prehraj(g,o,poradi); ctx.hotovo(pochvala()+`<p>Opravený postup ${popisVysledku(u,o)}.</p>`); return; }
        pokusy++; ctx.chyba(); b.classList.add('spatne'); b.disabled=true;
        await prehraj(g,o,poradi);
        if (pokusy===1) ctx.zprava('rada', `<p><b>Tenhle postup ${popisVysledku(u,o)}.</b> Zkus jiný.</p>`);
        else { box.querySelectorAll('button').forEach(x=>{ x.disabled=true; if(+x.dataset.i===sp.oprava) x.classList.add('spravne'); });
          g.reset(); const j=[...box.children].findIndex(x=>+x.dataset.i===sp.oprava); await prehraj(g,u.opravy[sp.oprava],j);
          ctx.hotovo(`<p><b>Správná oprava je označená zeleně.</b> Dovede Pípu až k domu.</p>`); }
      };
      box.appendChild(b);
    });
  }
}

// --- typ: postav cestu ---
function ulohaStavba(ctx){
  const {m, u, obsah} = ctx; const nej = odpoved(m,u); let pokusy = 0, program = '', hotovo = false;
  obsah.innerHTML = `<p class="zadani">Poskládej cestu z šipek ke dveřím domu a klepni na Spustit.</p>${pravidlaHTML()}
    <div class="uloha-layout"><div id="m"></div><div><b>Tvůj algoritmus:</b><div class="program" id="prog"></div>
    <div class="pad" aria-label="Šipky"><span></span><button data-s="↑" aria-label="nahoru">↑</button><span></span>
    <button data-s="←" aria-label="vlevo">←</button><button data-s="↓" aria-label="dolů">↓</button><button data-s="→" aria-label="vpravo">→</button></div>
    <div class="ovladani"><button class="tl" id="spust">Spustit ▶</button><button class="tl druhe maly" id="zpet">⌫ Smazat poslední</button><button class="tl druhe maly" id="vse">Smazat vše</button></div></div></div>`;
  const g = vytvorMrizku(u); obsah.querySelector('#m').appendChild(g.el);
  const prog = obsah.querySelector('#prog');
  const kresli = () => { prog.innerHTML=''; if(!program){ prog.innerHTML='<span class="prazdne">Zatím prázdné. Klepej na šipky.</span>'; return; } prog.appendChild(radekPostupu(program)); };
  kresli();
  const pridej = s => { if(hotovo||zaneprazdneno||sipky(program).length>=16) return; program+=s; g.reset(); kresli(); };
  obsah.querySelectorAll('.pad button').forEach(b => b.onclick = () => pridej(b.dataset.s));
  const klavesy = e => { const k={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'}[e.key]; if(k && document.body.contains(prog)){ e.preventDefault(); pridej(k); } };
  document.addEventListener('keydown', klavesy);
  obsah.querySelector('#zpet').onclick = () => { if(hotovo||zaneprazdneno) return; program=[...program].slice(0,-1).join(''); g.reset(); kresli(); };
  obsah.querySelector('#vse').onclick = () => { if(hotovo||zaneprazdneno) return; program=''; g.reset(); kresli(); };
  obsah.querySelector('#spust').onclick = async () => {
    if (hotovo || zaneprazdneno) return;
    if (!program){ ctx.zprava('rada','<p>Nejdřív poskládej aspoň jednu šipku.</p>'); return; }
    g.reset(); kresli(); const radek = prog.querySelector('.radek-postupu');
    await prehraj(g, program, 0, radek);
    const s = simuluj(u, program), delka = sipky(program).length;
    if (dojde(u, program)){
      hotovo = true; document.removeEventListener('keydown', klavesy);
      const bonus = delka===nej.length ? `<p>⭐ <b>Bonus:</b> tohle je nejkratší možná cesta (${kroky(delka)})!</p>` : `<p>Tvoje cesta má ${kroky(delka)}, nejkratší by měla ${kroky(nej.length)}. I tvoje cesta je ale správná.</p>`;
      ctx.hotovo(pochvala()+bonus); return;
    }
    pokusy++; ctx.chyba();
    const co = s.stop>=0 ? `Pípa se zastavil při <b>${s.stop+1}. příkazu</b>, protože ${s.proc==='okraj'?'by vyšel z mřížky':'mu v cestě stál strom'}.` : 'Pípa provedl všechny příkazy, ale nestojí u domu.';
    if (pokusy===1) ctx.zprava('rada', `<p><b>Skoro!</b> ${co} Oprav postup od toho místa a spusť ho znovu.</p>`);
    else {
      hotovo = true; document.removeEventListener('keydown', klavesy);
      ctx.zprava('reseni', `<p>${co}</p><p>Podívej se na jednu možnou cestu:</p>`);
      program = nej; kresli(); g.reset(); await prehraj(g, nej, 1, prog.querySelector('.radek-postupu'));
      ctx.hotovo(`<p>${co}</p><p>Tahle cesta dovede Pípu k domu: ${sipky(nej).join(' ')}. Příště to zvládneš!</p>`);
    }
  };
}

// --- typ: porovnání cest ---
function ulohaPorovnani(ctx){
  const {m, u, obsah} = ctx; const sp = odpoved(m,u); let pokusy = 0;
  const otazky = {narazi:'Která cesta narazí?', bezpecna:'Která cesta dovede Pípu bezpečně k domu?', kolik:'Kolik cest dovede Pípu k domu?', nejkratsi:'Která cesta dojde k domu a je nejkratší?'};
  obsah.innerHTML = `<p class="zadani">${otazky[u.otazka]}</p>${pravidlaHTML()}<div class="uloha-layout"><div id="m"></div><div><div id="r"></div><div class="moznosti" id="o"></div></div></div>`;
  const g = vytvorMrizku(u); obsah.querySelector('#m').appendChild(g.el);
  const radky = u.cesty.map((c,i)=>radekPostupu(c,{stitek:i})); obsah.querySelector('#r').append(...radky);
  const volby = u.otazka==='kolik' ? [[1,'Jedna'],[2,'Dvě'],[3,'Všechny tři']] : u.cesty.map((c,i)=>[i,'Cesta '+PISMENA[i]]);
  const vysv = () => '<p>' + u.cesty.map((c,i)=>`Cesta ${PISMENA[i]} ${popisVysledku(u,c)}.`).join(' ') + '</p>';
  const ukaz = async () => { g.reset(); for (let i=0;i<u.cesty.length;i++){ await prehraj(g,u.cesty[i],i,radky[i]); await cekej(250); } };
  const box = obsah.querySelector('#o');
  volby.forEach(([k,t]) => {
    const b = document.createElement('button'); b.className='moznost'; b.textContent=t; b.dataset.k=k;
    b.onclick = async () => {
      if (zaneprazdneno) return;
      if (k===sp){ b.classList.add('spravne'); box.querySelectorAll('button').forEach(x=>x.disabled=true);
        await ukaz(); ctx.hotovo(pochvala()+vysv()); return; }
      pokusy++; ctx.chyba(); b.classList.add('spatne'); b.disabled=true;
      if (pokusy===1) ctx.zprava('rada', `<p><b>Ještě jednou.</b> Projdi každou cestu zvlášť, šipku po šipce. ${u.otazka==='nejkratsi'?'Pak spočítej šipky u cest, které dojdou.':'Hlídej stromy a okraj mřížky.'}</p>`);
      else { box.querySelectorAll('button').forEach(x=>{ x.disabled=true; if(+x.dataset.k===sp) x.classList.add('spravne'); });
        await ukaz(); ctx.hotovo(`<p><b>Podívej se na všechny cesty.</b></p>`+vysv()); }
    };
    box.appendChild(b);
  });
}

// ---------- konec mise, diplom ----------
function dokonciMisi(mi){
  const m = HRA.mise[mi], p = S.pozice[m.id];
  const podil = p.ok / m.ulohy.length, h = podil>=0.85?3:podil>=0.6?2:1;
  const pred = S.hotovo[m.id]; S.hotovo[m.id] = {hvezdy: Math.max(h, pred?pred.hvezdy:0)};
  S.pozice[m.id] = {i:0, ok:0}; uloz();
  const posledni = HRA.mise.every(x=>S.hotovo[x.id]);
  $app.innerHTML = hlavicka(esc(m.nazev)) + `<div class="karta odmena"><div style="width:140px;margin:0 auto">${pipaSVG()}</div>
    <h2>${esc(m.ulice)} svítí! 💡</h2><div class="hvezdy">${hvezdy(h)}</div>
    <p>Napoprvé správně: ${p.ok} z ${m.ulohy.length}</p><p style="font-size:1.05rem">${esc(m.zaverMise)}</p>
    <div class="ovladani" style="justify-content:center"><button class="tl" id="zpet">${posledni?'Podívat se na městečko 🎄':'Zpět do městečka ▶'}</button></div></div>`;
  navazHlavicku(); document.getElementById('zpet').onclick = mestecko;
}
function diplom(){
  const d = new Date().toLocaleDateString('cs-CZ');
  const celkem = HRA.mise.reduce((a,m)=>a+(S.hotovo[m.id]?S.hotovo[m.id].hvezdy:0),0);
  $app.innerHTML = hlavicka('Diplom') + `<div class="diplom"><div style="width:110px;margin:0 auto">${pipaSVG()}</div>
    <h2>${esc(HRA.diplom.nadpis)}</h2><p style="font-size:1.2rem;margin:0">${esc(HRA.nazev)}</p>
    <div class="jmeno">${esc(S.jmeno)}</div><p style="font-size:1.3rem;font-weight:bold;color:var(--vecer)">${esc(HRA.diplom.titul)}</p>
    <p style="max-width:620px;margin:0 auto">${esc(S.jmeno)} ${esc(HRA.diplom.text)}</p>
    <p class="hvezdy" style="font-size:1.4rem;margin-top:10px">★ ${celkem} z ${HRA.mise.length*3} hvězd</p>
    <div class="podpisy"><div><div class="cara">${d}</div>datum</div><div><div class="cara">${esc(HRA.autor)}</div>Informatika, 4. třída</div></div>
    <p style="font-size:.7rem;color:#8a9bb0;margin-top:14px">CZŠ Kroměříž • ${esc(HRA.autor)} (vytvořeno pomocí AI)</p></div>
    <div class="ovladani neprint" style="justify-content:center"><button class="tl" id="tisk">🖨️ Vytisknout</button><button class="tl druhe" id="zpet">Zpět do městečka</button></div>`;
  navazHlavicku();
  document.getElementById('tisk').onclick = () => window.print();
  document.getElementById('zpet').onclick = mestecko;
}

  const snih = document.getElementById('snih');
  for (let i=0;i<14;i++){ const v=document.createElement('div'); v.className='vlocka'; v.textContent='❄';
    v.style.left=(Math.random()*100)+'vw'; v.style.fontSize=(10+Math.random()*12)+'px';
    v.style.animationDuration=(14+Math.random()*16)+'s'; v.style.animationDelay=(-Math.random()*25)+'s'; snih.appendChild(v); }
  document.documentElement.classList.toggle('velke', !!S.velke);
  zkontrolujData();
  uvod();
})();
</script>
